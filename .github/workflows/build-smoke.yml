name: build-smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  linux-openjdk-21:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenJDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify toolchain
        run: |
          java -version
          javac -version
          gcc --version | head -n 1
      - name: Build and test
        run: make test
