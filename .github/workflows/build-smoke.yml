name: build-smoke

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux-openjdk-21:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenJDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify toolchain
        run: |
          java -version
          javac -version
          gcc --version | head -n 1
          uname -a
          uname -r
          ldd --version | head -n 1
      - name: Build and test
        run: make test
